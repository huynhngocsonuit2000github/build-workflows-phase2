name: tasklite-ci

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/tasklite/**'
      - '.github/workflows/tasklite-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/tasklite/**'
      - '.github/workflows/tasklite-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tasklite-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore apps/tasklite/TaskLite.slnx

      - name: Build solution
        run: dotnet build apps/tasklite/TaskLite.slnx --no-restore -c Release -warnaserror

      - name: Run tests
        run: dotnet test apps/tasklite/TaskLite.slnx --no-build -c Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/

  docker-build:
    name: Docker Build
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -f apps/tasklite/src/TaskLite.Api/Dockerfile apps/tasklite

      - name: Build Web Docker image
        run: docker build apps/tasklite/web
