name: tasklite

services:
  api:
    build:
      context: .
      dockerfile: src/TaskLite.Api/Dockerfile
    ports:
      - "5200:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Data Source=/data/tasklite.db
      - Seed__DemoData=true
      - Cors__AllowedOrigins__0=http://localhost:4300
    volumes:
      - tasklite-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "4300:80"
    volumes:
      - ./web/config.json:/usr/share/nginx/html/config.json:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  tasklite-data:
